# =============================================================================
# Veyronica — Render Blueprint Deployment
# =============================================================================
services:
  - type: web
    name: veyronica-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: "*"

  - type: worker
    name: veyronica-temporal-worker
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python -m app.temporal.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
