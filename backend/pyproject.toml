[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "veyronica"
version = "0.1.0"
description = "Veyronica — V-Mart Governed Agentic Replenishment Platform"
requires-python = ">=3.12,<3.14"
dependencies = [
    # --- Web framework ---
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    # --- Database ---
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.1",
    # --- Temporal ---
    "temporalio==1.9.0",
    # --- LangGraph ---
    "langgraph==0.2.60",
    "langchain-core==0.3.28",
    # --- LLM clients ---
    "openai==1.58.1",
    "anthropic==0.40.0",
    "google-generativeai==0.8.4",
    # --- Utilities ---
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
